# Herdr configuration (https://herdr.dev)
# Full defaults: `herdr --default-config`. Apply changes: `herdr server reload-config`.

onboarding = false

[theme]
name = "nord"

[terminal]
# Panes inherit $SHELL from the server process, not the login shell, so a
# server started before chsh keeps opening bash.
default_shell = "zsh"

[ui]
# Show detected agent (claude/codex) on split pane borders.
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
agent_panel_sort = "spaces"

[keys]
# Jump to the workspace/tab/pane of the most recent notification.
open_notification_target = "prefix+o"

[ui.toast]
# Notify via the outer terminal (Ghostty renders a native macOS
# notification; clicking it focuses Ghostty). "system" without
# terminal-notifier falls back to osascript, whose notifications are
# unclickable and show up as Script Editor.
delivery = "terminal"
delay_seconds = 2

[experimental]
# Ghostty supports the kitty graphics protocol.
kitty_graphics = true
# Keep the IME candidate window anchored to the cursor when typing CJK.
reveal_hidden_cursor_for_cjk_ime = true
# Switch to ASCII input while in prefix mode so keybindings aren't swallowed
# by the CJK input source (macOS only).
switch_ascii_input_source_in_prefix = true
